<!DOCTYPE html>
<!--
  src/index.html
  The single HTML page the browser loads.
  Angular renders the entire app inside <app-root>.

  SECURITY HEADERS via meta tags:
  The Content-Security-Policy restricts which sources the browser
  can load scripts, styles, and data from. This is a supplementary
  layer — the primary security headers are set by Helmet on the backend.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!--
    Content Security Policy:
    - default-src 'self'         → only load resources from our own origin
    - script-src 'self' 'unsafe-inline' → Angular requires inline scripts
    - connect-src → allow API calls to our backend (both http/https for dev)
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://localhost:3000 http://localhost:3000;
      font-src 'self';
      img-src 'self' data:;
    "
  />

  <title>Government Bulletin Board — APDS7311</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Georgia', 'Times New Roman', serif;
      background: #0f172a;
    }
  </style>
</head>
<body>
  <!-- Angular mounts the entire app here -->
  <app-root></app-root>
</body>
</html>
